[project]
name = "validation_agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "structlog>=24.1",
]

# Agent packages are installed with --no-deps in notebooks/02_run_validation_agent.py.
# Serverless Python 3.10 cannot resolve agent-framework-core 1.26 with the preinstalled libraries.
[project.optional-dependencies]
agent = ["agent-framework-core==1.24.0", "agent-framework-openai==1.17.0", "openai"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/validation_agent"]
